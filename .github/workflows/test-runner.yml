name: Python Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show files
        run: find .

      - name: Run day 1 test
        run: python -m unittest discover -s python/day1 -v

      - name: Run day 2 test
        run: python -m unittest discover -s python/day2 -v

      - name: Run day 3 test
        run: python -m unittest discover -s python/day3 -v

      - name: Run day 4 test
        run: python -m unittest discover -s python/day4 -v

      - name: Run day 4 test
        run: python -m unittest discover -s python/day5 -v